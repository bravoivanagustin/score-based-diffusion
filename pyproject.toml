[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "score-based-diffusion"
version = "0.1.0"
description = "Score-based diffusion models via SDEs, from 2D toy data to images"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Iván Agustín Bravo" }]
urls = { Homepage = "https://github.com/bravoivanagustin/score-based-diffusion", Repository = "https://github.com/bravoivanagustin/score-based-diffusion" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.1",
    "torch>=2.0",
    "pyyaml>=6",
    "torchvision>=0.15",
    "pillow>=9.1",
    "tqdm>=4.64",
    "matplotlib>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]
analysis = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "lpips>=0.1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# On Linux, use the CUDA 12.6 wheels: the default PyPI wheel targets CUDA 13 and needs a newer driver.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # the formatter handles code; long comments and strings are left alone
    "E741",  # single-letter math names (l, I) are fine here
    "B905",  # zip() without strict=
    "SIM105",  # try/except/pass is clearer than contextlib.suppress here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # imports after pytest.importorskip(...)
"scripts/*" = ["E402"]  # imports after inserting src/ into sys.path
